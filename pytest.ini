[pytest]
# Let tests import the `pages` and `config` packages from the project root.
pythonpath = .
testpaths = tests
addopts = -v
markers =
    happy: core happy-path flows that must always pass
    negative: error handling and validation cases
    bug: tests that catch bugs the site plants on purpose (expected to fail)
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)-7s %(name)s: %(message)s
log_cli_date_format = %H:%M:%S
